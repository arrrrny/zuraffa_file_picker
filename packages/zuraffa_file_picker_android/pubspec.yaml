name: zuraffa_file_picker_android
description: >-
  The Android implementation of zuraffa_file_picker (Storage Access
  Framework): pick files, save documents and pick directories via the
  system document picker.
version: 7.4.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_file_picker
    platforms:
      android:
        package: com.zuraffa.file_picker
        pluginClass: ZuraffaFilePickerPlugin
        dartPluginClass: ZuraffaFilePickerAndroid

dependencies:
  flutter:
    sdk: flutter
  zuraffa_file_picker: ^7.4.1
  zuraffa_file_picker_platform_interface: ^7.4.1

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly. No sibling path stanzas — they poison the published archive
  # (pub does NOT strip overrides); local dev resolution rides a
  # gitignored pubspec_overrides.yaml.
  xml: 7.1.0
  zuraffa:
    path: ../../../zuraffa
dev_dependencies:
  zuraffa: ^7.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - file-picker
  - android
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_file_picker
issue_tracker: https://github.com/arrrrny/zuraffa_file_picker/issues
