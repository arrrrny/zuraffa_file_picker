name: zuraffa_file_picker_platform_interface
description: >-
  The platform interface contract for zuraffa_file_picker: the
  MethodChannel protocol and the FilePickerPort bridge platform
  implementations conform to.
version: 7.3.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  zuraffa_file_picker: ^7.3.0

dependency_overrides:
  zuraffa_file_picker:
    path: ../zuraffa_file_picker

  xml: 7.1.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - file-picker
  - platform-interface
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_file_picker
issue_tracker: https://github.com/arrrrny/zuraffa_file_picker/issues
