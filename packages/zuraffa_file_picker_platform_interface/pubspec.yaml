name: zuraffa_file_picker_platform_interface
description: >-
  The platform interface contract for zuraffa_file_picker: the
  MethodChannel protocol and the FilePickerPort bridge platform
  implementations conform to.
version: 7.4.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  zuraffa_file_picker: ^7.4.2

dependency_overrides:
  # Fleet-wide xml policy: pin the override to the latest xml so graphs
  # that still transitively pull the abandoned minio (xml 6.x) resolve
  # cleanly. No sibling path stanzas — they poison the published archive
  # (pub does NOT strip overrides); local dev resolution rides a
  # gitignored pubspec_overrides.yaml.
  xml: 7.1.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - file-picker
  - platform-interface
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_file_picker
issue_tracker: https://github.com/arrrrny/zuraffa_file_picker/issues
