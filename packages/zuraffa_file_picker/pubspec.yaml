name: zuraffa_file_picker
description: >-
  Typed file picking for the Zuraffa ecosystem: a pure-Dart
  FilePickerPort (pick, save, pick directory) with an in-memory default
  adapter and federated platform adapters.
version: 1.0.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.4.3
  zuraffa: ^7.0.0

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  lints: ^4.0.0
  mutation_test: ^1.8.0
  test: ^1.24.0

repository: https://github.com/arrrrny/zuraffa_file_picker
issue_tracker: https://github.com/arrrrny/zuraffa_file_picker/issues

topics:
  - file-picker
  - clean-architecture
  - zuraffa
  - state
