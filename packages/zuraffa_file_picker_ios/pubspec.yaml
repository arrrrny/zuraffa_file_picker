name: zuraffa_file_picker_ios
description: >-
  The iOS implementation of zuraffa_file_picker
  (UIDocumentPickerViewController): pick files, export documents and
  pick directories via the system document picker.
version: 7.3.6
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    implements: zuraffa_file_picker
    platforms:
      ios:
        pluginClass: ZuraffaFilePickerPlugin
        dartPluginClass: ZuraffaFilePickerIOS

dependencies:
  flutter:
    sdk: flutter
  zuraffa_file_picker: ^7.3.6
  zuraffa_file_picker_platform_interface: ^7.3.6

dependency_overrides:
  xml: 7.1.0
  zuraffa:
    path: ../../../zuraffa
dev_dependencies:
  zuraffa: ^7.3.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - file-picker
  - ios
  - zuraffa

repository: https://github.com/arrrrny/zuraffa_file_picker
issue_tracker: https://github.com/arrrrny/zuraffa_file_picker/issues
